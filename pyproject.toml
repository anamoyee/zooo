[project]
name            = "zooo"
dynamic         = ["version"]
description     = "A Python wrapper around the https://gdcolon.com/zoo API + CLI/TUI"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "GPL-3.0" }
authors         = [{ name = "anamoyee" }]
maintainers     = [{ name = "anamoyee" }]

classifiers = [ #
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3 :: Only",
	"Typing :: Typed",
	"Topic :: Utilities",
	"Operating System :: POSIX",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS",
	"Operating System :: Microsoft :: Windows",
	"Operating System :: Microsoft :: MS-DOS",
]

dependencies = [ #
	"pydantic>=2.13.5",
	"rich>=14.0.0",
	"textual>=8.2.8",
	"arguably>=1.3.0",
	"tcrutils>=13.1.39",
	"nya-aio-exc-group>=0.1.0",
	"nya-result>=0.1.4",
	"nya-fmt>=0.1.5",
	"httpx>=0.28.1",
	"httpx-limiter[aiolimiter]>=0.6.1",
	"typing-extensions>=4.16.0",
]

[project.optional-dependencies]
gui = [ #
	"dearpygui>=2.3.1",
]

[dependency-groups]
dev = [ #
	"pre-commit>=4.6.2",
	"pytest>=9.1.1",
	"ruff>=0.16.8",
	"ty>=0.0.83",
	"uv>=0.12.17",
	"yelp-gprof2dot>=1.2.0",
]

[project.scripts]
zooo = "zooo.ui:main"
zoo  = "zooo.ui:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path    = "src/zooo/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'
